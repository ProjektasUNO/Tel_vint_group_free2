name: Vinted deal finder

on:
  schedule:
    # Kas valanda vienas ~55 min. darbas, kuriame Vinted tikrinamas kas 5 min. (zr. LOOP_*).
    # GitHub suplanuotus paleidimus gali smarkiai atideti, tad pagrindinis – isorinis
    # zadintuvas per workflow_dispatch (pvz. cron-job.org kas valanda).
    # Skelbiu ir Pirkpard tikrina atskiras serveris – ten pat jis ima kainu baze is `busena`.
    - cron: "0 * * * *"
  workflow_dispatch:     # rankinis arba isorinis zadintuvas
  push:
    branches: [main]

concurrency:
  group: vinted-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # Kodo leidimo push suaktyvina paleidima; busenos commitai – ne.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'RELEASE v50-free')
    runs-on: ubuntu-latest
    timeout-minutes: 85    # 54 min. ciklas + paskutinis paleidimas (iki MAX_RUN_MINUTES)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Idiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Atsiusti busena
        env:
          STATE_BRANCH: busena
        run: |
          if git fetch --depth=1 origin "$STATE_BRANCH" 2>/dev/null; then
            for f in seen.json state.json; do
              if git show "FETCH_HEAD:$f" > "$f.gauta" 2>/dev/null; then mv "$f.gauta" "$f"; else rm -f "$f.gauta"; fi
            done
            git archive FETCH_HEAD archive 2>/dev/null | tar -x 2>/dev/null || true
            echo "Busena paimta is sakos '$STATE_BRANCH'"
          else
            echo "Sakos '$STATE_BRANCH' dar nera – naudoju repozitorijos failus"
          fi
          ls -l seen.json state.json 2>/dev/null || true

      - name: Tikrinti kas 5 min. (~55 min.)
        env:
          BOT_TOKEN: ${{ secrets.BOT }}
          CHAT_ID: ${{ secrets.TEL }}
          # Palikta pasirenkama, bet nenaudojama, jei grupėje nėra forumo temos.
          CHAT_TOPIC_ID: ${{ secrets.TOPIC_IPHONE }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT }}
          STATE_BRANCH: busena
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_EVERY: 300        # tarp paleidimu PRADZIU; ilgesnis paleidimas – kitas iskart po jo
          LOOP_MINUTES: 54       # nauju paleidimu nebepradedam po tiek minuciu
        run: |
          # Busena issaugoma po KIEKVIENO paleidimo: nutrukus darbui prarandama ne daugiau
          # 5 min., o serveris gauna sviezia kainu baze.
          # Viena darbine repozitorija visam ciklui. Pirmiausia parsisiunciam esama busena: tada push'as
          # siuncia tik PAKITUSIUS failus (state.json, sios dienos archyvas), o ne visus ~17 MB kas 5 min.
          # (2026-10-23: viso turinio push'ai nutrukdavo HTTP 408 – prarasta ~10 min.). Commit'as vis tiek
          # be tevu (commit-tree), tad sakos istorija neauga.
          state_repo=$(mktemp -d)
          git -C "$state_repo" init -q
          git -C "$state_repo" config user.name "github-actions"
          git -C "$state_repo" config user.email "github-actions@users.noreply.github.com"
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
          git -C "$state_repo" fetch -q --depth=1 "$remote" "$STATE_BRANCH" 2>/dev/null || echo "Busenos sakos dar nera"

          save_state() {
            if [ ! -f seen.json ] && [ ! -f state.json ]; then echo "Nera ko saugoti"; return 0; fi
            rm -rf "$state_repo/seen.json" "$state_repo/state.json" "$state_repo/archive"
            for f in seen.json state.json; do [ -f "$f" ] && cp "$f" "$state_repo/$f"; done
            if [ -d archive ]; then cp -r archive "$state_repo/archive"; fi
            (
              cd "$state_repo"
              git add -A
              commit=$(git commit-tree "$(git write-tree)" -m "Busena $(date -u '+%Y-%m-%d %H:%M UTC')")
              for i in 1 2 3; do
                if git push -q --force "$remote" "$commit:refs/heads/$STATE_BRANCH"; then
                  echo "Busena issaugota sakoje '$STATE_BRANCH'"; exit 0
                fi
                echo "Nepavyko issaugoti ($i)"; sleep $((i * 5))
              done
              exit 1
            )
          }

          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          failed=0
          n=0
          while :; do
            n=$((n + 1))
            began=$(date +%s)
            echo "::group::Paleidimas $n ($(date -u '+%H:%M:%S UTC'))"
            rc=0; python vinted_deal_finder.py || rc=$?
            echo "::endgroup::"
            [ "$rc" -eq 2 ] && exit 2          # nera BOT_TOKEN / CHAT_ID – kartoti nera prasmes
            [ "$rc" -ne 0 ] && failed=$((failed + 1))
            save_state || failed=$((failed + 1))
            next=$(( began + LOOP_EVERY ))
            [ "$next" -ge "$end" ] && break
            now=$(date +%s)
            [ "$next" -gt "$now" ] && sleep $(( next - now ))
          done
          echo "Paleidimu: $n, nesekmingu: $failed"
          [ "$failed" -eq 0 ]
